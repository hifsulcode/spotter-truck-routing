# Render Blueprint: one click deploys the API and the web app.
# New + > Blueprint > pick this repo. Then set VITE_API_URL / CORS origins
# below to the URLs Render assigns if you rename the services.
services:
  - type: web
    name: truck-routing-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: truck-routing-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://truck-routing-web.onrender.com

  - type: web
    name: truck-routing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://truck-routing-api.onrender.com
